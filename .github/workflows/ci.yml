name: KisanSlot Platform CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Critical Path Tests (Django & DRF)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Check
        env:
          USE_SQLITE: "True"
          SECRET_KEY: "django-ci-test-secret-key-kisan-slot-platform-sih-2026"
          DEBUG: "True"
        run: |
          python backend/manage.py check

      - name: Run Backend Tests (Accounts & Bookings)
        env:
          USE_SQLITE: "True"
          SECRET_KEY: "django-ci-test-secret-key-kisan-slot-platform-sih-2026"
          DEBUG: "True"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          python backend/manage.py test accounts bookings --verbosity=2

  frontend-tests:
    name: Frontend Smoke Tests (Next.js & Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check TypeScript Compilation
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Smoke Tests
        working-directory: ./frontend
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload Playwright Test Report (On Failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-compose-validate:
    name: Docker Compose Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Compose Services
        run: docker compose build --parallel
